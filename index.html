<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Product Search</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <header class="topbar">
    <div>
      <h1>Product Search</h1>
      <p>Fast product price lookup</p>
    </div>
  </header>

  <section class="search-panel">
    <label for="search">Search</label>
    <div class="search-line">
      <input id="search" type="search" placeholder="Type 3+ characters..." autocomplete="off" spellcheck="false">
      <button id="clearBtn" type="button">Clear</button>
    </div>

    <label for="column" class="search-in-label">Search in</label>
    <select id="column">
      <option value="all">All Columns</option>
      <option value="Divison">Division</option>
      <option value="Category">Category</option>
      <option value="Item Code">Item Code</option>
      <option value="Item Description">Item Description</option>
      <option value="SDP">SDP</option>
      <option value="NRP">NRP</option>
      <option value="MRP">MRP</option>
      <option value="Discount 21.18%">Discount 21.18%</option>
      <option value="Discount">Discount</option>
    </select>

    <div class="status">
      <strong id="resultCount">Loading data...</strong>
      <span id="hint">Enter 3 or more characters to search.</span>
    </div>
  </section>

  <!-- Desktop table -->
  <section class="desktop-results">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Division</th>
            <th>Category</th>
            <th>Item Code</th>
            <th>Item Description</th>
            <th>SDP</th>
            <th>NRP</th>
            <th>MRP</th>
            <th>Discount 21.18%</th>
            <th>Discount</th>
          </tr>
        </thead>
        <tbody id="results"></tbody>
      </table>
    </div>
  </section>

  <!-- Mobile cards -->
  <section id="mobileResults" class="mobile-results"></section>

  <div id="empty" class="empty">Enter a search term to see matching products.</div>

  <div class="pagination">
    <button id="prevBtn" type="button">‹ Previous</button>
    <span id="pageInfo">Page 0 of 0</span>
    <button id="nextBtn" type="button">Next ›</button>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
