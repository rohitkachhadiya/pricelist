<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f6f8">
<title>Product Search</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">

  <header>
    <h1>Product Search</h1>
    <p>Fast product price lookup</p>
  </header>

  <section class="search-panel">
    <label for="search">Search</label>
    <div class="search-row">
      <div class="input-wrap">
        <span class="search-icon">⌕</span>
        <input id="search" type="search" placeholder="Type at least 3 characters..."
               autocomplete="off" spellcheck="false">
        <button id="clearInput" class="input-clear" type="button" aria-label="Clear search">×</button>
      </div>
    </div>

    <div class="button-row">
      <button id="searchBtn" class="search-btn" type="button">⌕ &nbsp; Search</button>
      <button id="clearBtn" class="clear-btn" type="button">↶ &nbsp; Clear</button>
    </div>

    <label for="column" class="search-label">Search in</label>
    <select id="column">
      <option value="all">All Columns</option>
      <option value="Divison">Division</option>
      <option value="Category">Category</option>
      <option value="Item Code">Item Code</option>
      <option value="Item Description">Item Description</option>
      <option value="SDP">SDP</option>
      <option value="NRP">NRP</option>
      <option value="MRP">MRP</option>
      <option value="Discount 21.18%">Discount 21.18%</option>
      <option value="Discount">Discount</option>
    </select>
  </section>

  <section class="summary">
    <strong id="resultCount">Loading data...</strong>
    <span id="hint">Enter 3 or more characters to search.</span>
  </section>

  <section class="results-card">
    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th>Item Code</th>
            <th>Description</th>
            <th>Division</th>
            <th>Category</th>
            <th>SDP</th>
            <th>NRP</th>
            <th>MRP</th>
            <th class="discount-col">Discount<br>21.18%</th>
            <th class="discount-col">Discount</th>
          </tr>
        </thead>
        <tbody id="results"></tbody>
      </table>
    </div>
    <div id="empty" class="empty">Enter a search term to see matching products.</div>
  </section>

  <section class="pagination">
    <button id="prevBtn" type="button">‹ &nbsp; Previous</button>
    <span id="pageInfo">Page 0 of 0</span>
    <button id="nextBtn" type="button">Next &nbsp; ›</button>
  </section>

  <div class="record-info" id="recordInfo"></div>

</div>
<script src="script.js"></script>
</body>
</html>
